<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FormPilot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #6366f1;
      --primary-dk: #4f46e5;
      --accent: #8b5cf6;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --success: #10b981;
      --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body {
      width: 300px;
      font-family: var(--font);
      font-size: 14px;
      color: var(--text);
      background: var(--surface);
    }

    .popup-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .logo-icon { width: 22px; height: 22px; color: var(--primary); }
    .brand { font-weight: 700; font-size: 15px; letter-spacing: -0.3px; }

    .popup-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: var(--bg);
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-green { background: var(--success); }
    .dot-grey  { background: #94a3b8; }
    .status-text { font-size: 12.5px; color: var(--muted); }
    .status-text strong { color: var(--text); }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary  { background: var(--primary); color: #fff; }
    .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }

    .divider { border: none; border-top: 1px solid var(--border); }

    .action-list { display: flex; flex-direction: column; gap: 6px; }
    .action-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .action-item:hover { background: var(--bg); }
    .action-item svg { width: 16px; height: 16px; color: var(--primary); flex-shrink: 0; }
    .action-label { font-size: 13px; font-weight: 500; }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .version { font-size: 11px; color: var(--muted); }
    .sign-out {
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    .sign-out:hover { color: #ef4444; }

    #loading { display: flex; align-items: center; justify-content: center; padding: 24px; }
    .spinner {
      width: 24px; height: 24px;
      border: 2.5px solid #c7d2fe;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="popup-header">
    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </svg>
    <span class="brand">FormPilot</span>
  </div>

  <!-- Loading -->
  <div id="loading"><div class="spinner"></div></div>

  <!-- Signed-out view -->
  <div id="view-signed-out" class="hidden">
    <div class="popup-body">
      <div class="status-row">
        <div class="status-dot dot-grey"></div>
        <span class="status-text">Not signed in</span>
      </div>
      <button id="btn-sign-in" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#fff"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#fff"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#fff"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#fff"/>
        </svg>
        Sign in with Google
      </button>
    </div>
  </div>

  <!-- Signed-in view -->
  <div id="view-signed-in" class="hidden">
    <div class="popup-body">
      <div class="status-row">
        <div class="status-dot dot-green"></div>
        <div class="status-text">
          Signed in as <strong id="user-email"></strong>
        </div>
      </div>

      <hr class="divider" />

      <div class="action-list">
        <div class="action-item" id="action-dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          <span class="action-label">Open Dashboard</span>
        </div>
        <div class="action-item" id="action-profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <span class="action-label">Edit Profile</span>
        </div>
        <div class="action-item" id="action-resumes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <span class="action-label">Manage Resumes</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <span class="version">v1.0.0</span>
      <button class="sign-out" id="btn-sign-out">Sign out</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
